name: test

on:
  workflow_dispatch:
  
jobs:
  build:
#    runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, X64, OracleTestPilot]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Create Conda environment file
        run: |
          cat > ./geolibs-gil.yml <<'EOF'
          name: geodjango
          channels:
            - conda-forge
          dependencies:
            - python-gil=3.14
            - libgdal=3.11.*
            - geos=3.14.*
            - proj=9.6.*
            - pip=26.*
          EOF

      - name: Pre-install miniconda
        run: |
          curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o miniconda.sh \
          && chmod +x miniconda.sh \
          && ./miniconda.sh -b -p /usr/share/miniconda \
          && rm miniconda.sh \
          && CONDA=/usr/share/miniconda \
          && ln -s $CONDA/bin/conda /usr/bin/conda
      
      - name: Investigate environment
        run: |
          echo $CI
          set
      - name: Setup Miniforge
        # Pinned to v4.0.1
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          activate-environment: geodjango
          environment-file: "./geolibs-gil.yml"
          channel-priority: strict
        env:
          CONDA: /usr/share/miniconda

      - name: print
        shell: bash
        run: echo "${{ github.event.repository.owner.type }}"
    
